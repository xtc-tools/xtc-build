name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        os: [ubuntu-24.04, macos-14, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU build tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc binutils make

      - name: Install GNU build tools on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install gcc binutils make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix binutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Synchronize development environment
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Show build tool versions
        run: |
          gcc --version
          ar --version
          make --version

      - name: Run checks
        run: uv run --locked make check
